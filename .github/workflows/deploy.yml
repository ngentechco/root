name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Build and push Docker image
        run: |
          docker build -t ngentech-root:${{ github.sha }} .
          docker tag ngentech-root:${{ github.sha }} ngentech-root:latest
          # Push to registry (configure with your registry)
          # docker push ngentech-root:latest

      - name: Deploy to production
        run: |
          echo "Deploying to production..."
          # Add your deployment commands here
          # e.g., kubectl, docker-compose, SSH to server, etc.
          
          # Example: SSH to server and pull latest
          # ssh ${{ secrets.SERVER_HOST }} "cd /path/to/app && docker-compose up -d"
