name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image to GHCR
        run: |
          docker build -t ngentech-root:${{ github.sha }} .
          docker tag ngentech-root:${{ github.sha }} ghcr.io/ngentechco/root/ngentech-root:latest
          docker tag ngentech-root:${{ github.sha }} ghcr.io/ngentechco/root/ngentech-root:${{ github.sha }}
          docker push ghcr.io/ngentechco/root/ngentech-root:latest
          docker push ghcr.io/ngentechco/root/ngentech-root:${{ github.sha }}

      - name: Deploy to production
        run: |
          echo "Deploying to production..."
          # Add your deployment commands here
          # e.g., kubectl, docker-compose, SSH to server, etc.
          
          # Example: SSH to server and pull latest
          # ssh ${{ secrets.SERVER_HOST }} "cd /path/to/app && docker-compose up -d"
