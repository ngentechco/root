services:
  # Next.js Frontend
  root:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ngentech_root
    restart: unless-stopped
    ports:
      - "8017:8007"
    environment:
      - NODE_ENV=production
      - SERVICE_NAME=root
      - SERVICE_PORT=8007
      - DATABASE_URL=${DATABASE_URL:-mysql://user:pass@mysql:3306/root_db}
      - WORDPRESS_API_URL=http://wordpress:80/graphql
    networks:
      - ecosystem_network
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8007/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # WordPress (Headless CMS with WPGraphQL)
  wordpress:
    image: wordpress:php8.2-fpm-alpine
    container_name: ngentech_wordpress
    restart: unless-stopped
    ports:
      - "8018:80"
    environment:
      - WORDPRESS_DB_HOST=mysql
      - WORDPRESS_DB_NAME=wordpress
      - WORDPRESS_DB_USER=wp_user
      - WORDPRESS_DB_PASSWORD=wp_pass
      - WORDPRESS_TABLE_PREFIX=ngen_
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - ecosystem_network
    depends_on:
      mysql:
        condition: service_healthy

  # MySQL Database (Shared)
  mysql:
    image: mysql:8.0
    container_name: ngentech_root_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: root_db
      MYSQL_USER: user
      MYSQL_PASSWORD: pass
    volumes:
      - root_db_data:/var/lib/mysql
    networks:
      - ecosystem_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpass"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  ecosystem_network:
    external: true

volumes:
  root_db_data:
  wordpress_data:
