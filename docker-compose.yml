version: '3.8'

services:
  # Next.js Frontend
  root:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ngentech_root
    restart: unless-stopped
    ports:
      - "8007:8007"
    environment:
      - NODE_ENV=production
      - SERVICE_NAME=root
      - SERVICE_PORT=8007
      - DATABASE_URL=${DATABASE_URL:-postgresql://user:pass@postgres:5432/root_db}
      - WORDPRESS_API_URL=http://wordpress:8008/graphql
    networks:
      - ecosystem_network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8007/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # WordPress (Headless CMS with WPGraphQL)
  wordpress:
    image: wordpress:php8.2-fpm-alpine
    container_name: ngentech_wordpress
    restart: unless-stopped
    ports:
      - "8008:80"
    environment:
      - WORDPRESS_DB_HOST=postgres
      - WORDPRESS_DB_NAME=wordpress
      - WORDPRESS_DB_USER=wp_user
      - WORDPRESS_DB_PASSWORD=wp_pass
      - WORDPRESS_TABLE_PREFIX=wp_
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - ecosystem_network
    depends_on:
      postgres:
        condition: service_healthy

  # PostgreSQL Database (Shared)
  postgres:
    image: postgres:15-alpine
    container_name: ngentech_root_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: root_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_MULTIPLE_DATABASES: wordpress
    volumes:
      - root_db_data:/var/lib/postgresql/data
    networks:
      - ecosystem_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d root_db"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  ecosystem_network:
    external: true

volumes:
  root_db_data:
  wordpress_data:
